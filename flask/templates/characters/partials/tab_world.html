    <section id="tab-char-world" class="tab-pane {% if active_tab == 'world' %}active{% endif %}">
      <div class="aimo-frame" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;">
        <div>
          <h3 style="color: var(--gold-accent); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
            🗺️ {{ _("Game World & Locations") }}
            <span class="field-help-btn" title="{{ _('Links a recommended world. Once selected, initial, preferred, and disliked locations can be chosen.') }}">?</span>
          </h3>

          <div>
            <label>
              {{ _("Recommended WorldInfo") }}
              <span class="field-help-btn" title="{{ _('Locations and events of this world are included in roleplay.') }}">?</span>
            </label>
            <select name="suggested_worldinfo_id" id="char-worldinfo-select">
              <option value="">-- {{ _("No WorldInfo linked") }} --</option>
              {% for wi in worldinfos %}
                <option value="{{ wi.id }}" {% if form.suggested_worldinfo_id == wi.id %}selected{% endif %}>{{ wi.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Conditional Container: Nur sichtbar, wenn eine Welt ausgewählt ist -->
        <div id="worldinfo-locations-container" style="{% if not form.suggested_worldinfo_id %}display: none;{% endif %} display: flex; flex-direction: column; gap: 1.25rem; border-top: 1px solid var(--border-wood-dark); padding-top: 1.25rem;">
          <div>
            <label>
              {{ _("Initial Location of First Message") }}
              <span class="field-help-btn" title="{{ _('Starting location for the conversation within the linked world.') }}">?</span>
            </label>
            <select name="initial_location_id" id="char-initial-location-select">
              <option value="">-- {{ _("No fixed starting location") }} --</option>
              {% for loc in all_locations %}
                <option value="{{ loc.id }}"
                        data-worldinfo-id="{{ loc.worldinfo_id }}"
                        {% if form.initial_location_id == loc.id %}selected{% endif %}>
                  {{ loc.name }}
                </option>
              {% endfor %}
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div>
              <label>
                {{ _("Preferred Locations (from linked world)") }}
                <span class="field-help-btn" title="{{ _('Locations where the character feels comfortable or likes to spend time.') }}">?</span>
              </label>
              <select name="preferred_location_ids" id="char-preferred-locations-select" multiple size="5">
                {% for loc in all_locations %}
                  <option value="{{ loc.id }}"
                          data-worldinfo-id="{{ loc.worldinfo_id }}"
                          {% if loc.id in form.preferred_location_ids %}selected{% endif %}>
                    {{ loc.name }}
                  </option>
                {% endfor %}
              </select>
              <div style="font-size: 0.74rem; color: var(--text-muted); margin-top: 0.25rem;">
                {{ _("Tip: Hold Ctrl/Cmd to select multiple.") }}
              </div>
            </div>

            <div>
              <label>
                {{ _("Disliked Locations (from linked world)") }}
                <span class="field-help-btn" title="{{ _('Locations the character avoids, fears, or dislikes.') }}">?</span>
              </label>
              <select name="disliked_location_ids" id="char-disliked-locations-select" multiple size="5">
                {% for loc in all_locations %}
                  <option value="{{ loc.id }}"
                          data-worldinfo-id="{{ loc.worldinfo_id }}"
                          {% if loc.id in form.disliked_location_ids %}selected{% endif %}>
                    {{ loc.name }}
                  </option>
                {% endfor %}
              </select>
              <div style="font-size: 0.74rem; color: var(--text-muted); margin-top: 0.25rem;">
                {{ _("Tip: Hold Ctrl/Cmd to select multiple.") }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 6: Lorebooks -->
