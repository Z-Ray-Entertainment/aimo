{% from "macros/buttons.html" import action_button, visibility_toggle %}
<div class="modal-backdrop" id="new-lorebook-modal" aria-hidden="true">
  <div class="modal-frame" style="max-width: 540px;">
    <div class="modal-header">
      <h3 style="color: var(--gold-accent);">Neues Lorebook erstellen</h3>
      {{ action_button("Schließen", icon="✕", layout="icon", modal_close="new-lorebook-modal") }}
    </div>
    <form method="POST" action="{{ url_for('lorebooks.create_lorebook') }}" style="display: flex; flex-direction: column; gap: 0.85rem;">
      <div style="display: flex; gap: 0.75rem;">
        <div style="flex: 1;">
          <label>Name des Lorebooks *</label>
          <input type="text" name="name" required>
        </div>
        <div>
          <label>{{ _("Visibility") }}</label>
          {{ visibility_toggle(value="private") }}
        </div>
      </div>
      <div>
        <label>Kurzbeschreibung</label>
        <textarea name="description" rows="3" placeholder="Kurzbeschreibung..."></textarea>
      </div>
      <div style="text-align: right;">
        {{ action_button("Anlegen", type="submit") }}
      </div>
    </form>
  </div>
</div>
